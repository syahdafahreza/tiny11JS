<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jendela Aplikasi Baru</title>
    <!-- Memuat Tailwind CSS untuk styling dasar -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Variabel CSS untuk tema */
        :root {
            --font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            --window-bg: #f0f0f0;
            --window-text: #000;
            --window-border: #a0a0a0;
            --control-hover-bg: #e6e6e6;
            --control-close-hover-bg: #e81123;
            --control-close-hover-text: white;
            
            /* Variabel untuk efek Liquid Glass */
            --c-glass: #f0f0f0;
            --c-light: #ffffff;
            --c-dark: #000000;
            --glass-reflex-dark: 1;
            --glass-reflex-light: 1;
            --saturation: 150%;
        }

        body.dark {
            --window-bg: #2b2b2b;
            --window-text: #f0f0f0;
            --window-border: #555555;
            --control-hover-bg: #3c3c3c;

            /* Variabel Liquid Glass Mode Gelap */
            --c-glass: #2b2b2b;
            --glass-reflex-dark: 2;
            --glass-reflex-light: 0.3;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            background-color: transparent;
            font-family: var(--font-family);
            color: var(--window-text);
            overflow: hidden;
            user-select: none;
        }

        /* --- Window Style --- */
        .app-window {
            display: flex;
            flex-direction: column;
            width: 100vw;
            height: 100vh;
            border: 1px solid var(--window-border);
            border-radius: 8px;
            background-color: var(--window-bg);
            transition: background-color 0.3s, box-shadow 0.3s, border-radius 0.3s;
        }

        /* Gaya "Fancy Mode" dengan efek Liquid Glass */
        body.fancy-mode .app-window {
            background-color: color-mix(in srgb, var(--c-glass) 15%, transparent);
            backdrop-filter: blur(8px) url(#liquid-glass-filter) saturate(var(--saturation));
            -webkit-backdrop-filter: blur(8px) url(#liquid-glass-filter) saturate(var(--saturation));
            box-shadow:
                inset 0 0 0 1px color-mix(in srgb, var(--c-light) calc(var(--glass-reflex-light) * 10%), transparent),
                inset 1.8px 3px 0px -2px color-mix(in srgb, var(--c-light) calc(var(--glass-reflex-light) * 90%), transparent),
                inset -2px -2px 0px -2px color-mix(in srgb, var(--c-light) calc(var(--glass-reflex-light) * 80%), transparent),
                inset -3px -8px 1px -6px color-mix(in srgb, var(--c-light) calc(var(--glass-reflex-light) * 60%), transparent),
                inset -0.3px -1px 4px 0px color-mix(in srgb, var(--c-dark) calc(var(--glass-reflex-dark) * 12%), transparent),
                inset -1.5px 2.5px 0px -2px color-mix(in srgb, var(--c-dark) calc(var(--glass-reflex-dark) * 20%), transparent),
                inset 0px 3px 4px -2px color-mix(in srgb, var(--c-dark) calc(var(--glass-reflex-dark) * 20%), transparent),
                inset 2px -6.5px 1px -4px color-mix(in srgb, var(--c-dark) calc(var(--glass-reflex-dark) * 10%), transparent),
                0px 1px 5px 0px color-mix(in srgb, var(--c-dark) calc(var(--glass-reflex-dark) * 10%), transparent),
                0px 6px 16px 0px color-mix(in srgb, var(--c-dark) calc(var(--glass-reflex-dark) * 8%), transparent);
            border: none; /* Hapus border saat fancy mode aktif */
        }

        .window-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: grab; /* Ubah cursor menjadi grab untuk drag */
            flex-shrink: 0;
            padding: 3px 3px 3px 6px;
            /* Pastikan header punya warna latar belakang */
            background-color: var(--window-bg); 
            border-bottom: 1px solid var(--window-border);
            border-top-left-radius: 8px;
            border-top-right-radius: 8px;
        }

        /* Hapus border header ketika fancy mode aktif */
        body.fancy-mode .window-header {
            border-bottom: none;
        }

        .window-title-container {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        h2 {
            font-weight: 500;
            font-size: 13px;
            margin: 0;
        }

        .window-controls {
            display: flex;
        }

        .window-control-btn {
            width: 45px;
            height: 29px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: transparent;
            border: none;
            color: var(--window-text);
            transition: background-color 0.1s;
        }

        .window-control-btn:hover {
            background-color: var(--control-hover-bg);
        }

        .close-window-btn {
            font-size: 22px;
            font-weight: 300;
            padding-bottom: 4px;
        }

        .close-window-btn:hover {
            background-color: var(--control-close-hover-bg);
            color: var(--control-close-hover-text);
        }

        .window-content-area {
            flex-grow: 1;
            overflow-y: auto;
            /* Isi konten di sini */
            padding: 1rem; 
        }

        /* Gaya untuk konten placeholder */
        .placeholder-content {
            text-align: center;
            padding-top: 50px;
            color: #6b7280; /* abu-abu */
        }

    </style>
</head>

<body>
    <!-- Filter SVG untuk efek Liquid Glass (Harus ada untuk Fancy Mode) -->
    <div style="position: absolute; width: 0; height: 0; z-index: -1;">
        <svg>
            <filter id="liquid-glass-filter" primitiveUnits="objectBoundingBox">
                <feImage result="map" width="100%" height="100%" x="0" y="0" preserveAspectRatio="none"
                    href="img/svg-filter.jpg" />

                <feGaussianBlur in="SourceGraphic" stdDeviation="0.00" result="blur" />
                <feDisplacementMap id="disp" in="blur" in2="map" scale="0.4" xChannelSelector="R" yChannelSelector="G">
                </feDisplacementMap>
            </filter>
        </svg>
    </div>

    <!-- Jendela Aplikasi -->
    <div id="new-app-window" class="app-window">
        <!-- Header Jendela (Drag Area) -->
        <div id="app-window-header" class="window-header">
            <div class="window-title-container">
                <!-- Anda bisa mengganti ikon ini dengan ikon aplikasi Anda -->
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                    class="h-4 w-4">
                    <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                    <line x1="9" y1="3" x2="9" y2="21"></line>
                    <line x1="15" y1="3" x2="15" y2="21"></line>
                    <line x1="3" y1="9" x2="21" y2="9"></line>
                    <line x1="3" y1="15" x2="21" y2="15"></line>
                </svg>
                <h2 id="app-window-title">Aplikasi Kosong</h2>
            </div>
            <!-- Kontrol Jendela -->
            <div class="window-controls">
                <!-- Tombol Minimize -->
                <button id="minimize-btn" class="window-control-btn" title="Minimize">
                    <svg width="10" height="2" viewBox="0 0 10 2" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M0 1H10V2H0V1Z" fill="currentColor" />
                    </svg>
                </button>
                <!-- Tombol Maximize/Restore -->
                <button id="maximize-btn" class="window-control-btn" title="Maximize">
                    <svg id="maximize-icon" width="10" height="10" viewBox="0 0 10 10" fill="none"
                        xmlns="http://www.w3.org/2000/svg">
                        <path d="M9 1V9H1V1H9ZM10 0H0V10H10V0Z" fill="currentColor" />
                    </svg>
                </button>
                <!-- Tombol Close -->
                <button id="close-btn" class="window-control-btn close-window-btn" title="Close">&times;</button>
            </div>
        </div>
        
        <!-- Area Konten Aplikasi -->
        <div class="window-content-area">
            <!-- Tempatkan konten aplikasi Anda di sini -->
            <div class="placeholder-content">
                <p class="text-xl font-light">Selamat Datang di Jendela Baru Anda!</p>
                <p class="text-sm mt-2">Anda dapat menghapus konten placeholder ini dan memulai pembangunan aplikasi Anda.</p>
                <p class="text-xs mt-4">Logika Minimize, Maximize, dan Drag sudah aktif. Fancy Mode dan Dark Theme didukung.</p>
            </div>
        </div>
    </div>

    <script>
        // Deklarasi Elemen
        const appId = 'NEW_APP'; // Ganti dengan ID unik aplikasi Anda
        const appWindow = document.getElementById('new-app-window');
        const header = document.getElementById('app-window-header');
        const closeBtn = document.getElementById('close-btn');
        const minimizeBtn = document.getElementById('minimize-btn');
        const maximizeBtn = document.getElementById('maximize-btn');
        const maximizeIcon = document.getElementById('maximize-icon');

        // State Dragging
        let isDragging = false;

        // Ikon SVG untuk Maximize dan Restore
        const iconMaximize = `<path d="M9 1V9H1V1H9ZM10 0H0V10H10V0Z" fill="currentColor" />`;
        const iconRestore = `<path fill-rule="evenodd" clip-rule="evenodd" d="M3 1H9V7H3V1ZM2 0H10V8H2V0Z" fill="currentColor"/><path d="M1 3H7V9H1V3ZM0 2H8V10H0V2Z" fill="currentColor" opacity="0.5"/>`;

        // --- Logika Interaksi Jendela (Berkomunikasi dengan Parent) ---

        // 1. Drag Window
        header.addEventListener('mousedown', (e) => {
            if (e.button === 0) { // Hanya merespons klik kiri
                isDragging = true;
                // Memberitahu parent untuk memindahkan frame iframe
                parent.postMessage({ action: 'drag-frame', appId: appId }, '*');
                e.preventDefault();
                header.style.cursor = 'grabbing';
            }
        });

        window.addEventListener('mousemove', (e) => {
            if (isDragging) {
                // Memberitahu parent untuk memperbarui posisi
                parent.postMessage({ action: 'update-drag-position', appId: appId, dx: e.movementX, dy: e.movementY }, '*');
            }
        });

        window.addEventListener('mouseup', () => {
            isDragging = false;
            header.style.cursor = 'grab';
        });

        // 2. Kontrol Jendela
        closeBtn.addEventListener('click', () => {
            // Memberitahu parent untuk menutup/menyembunyikan frame
            parent.postMessage({ action: 'close-frame', appId: appId }, '*');
        });

        minimizeBtn.addEventListener('click', () => {
            // Memberitahu parent untuk meminimalkan
            parent.postMessage({ action: 'minimize-frame', appId: appId }, '*');
        });

        maximizeBtn.addEventListener('click', () => {
            // Memberitahu parent untuk memaksimalkan/mengembalikan (restore)
            parent.postMessage({ action: 'maximize-frame', appId: appId }, '*');
        });

        // 3. Listener Pesan dari Parent (Mengubah Tema, Status Maximize, dan Fancy Mode)
        window.addEventListener('message', (event) => {
            const { action, isDark, isMaximized, borderRadius, isFancy } = event.data;

            if (action === 'theme-change') {
                document.body.classList.toggle('dark', isDark);
            }

            if (action === 'toggle-fancy-mode') {
                // Menerapkan kelas fancy-mode ke body untuk mengaktifkan Liquid Glass
                document.body.classList.toggle('fancy-mode', isFancy);
            }

            if (action === 'set-maximized-state') { 
                if (isMaximized) {
                    maximizeBtn.title = "Restore Down";
                    // Ganti ikon menjadi kotak bertumpuk untuk "restore"
                    maximizeIcon.innerHTML = iconRestore;
                    // Hapus border-radius saat maximized
                    appWindow.style.borderRadius = borderRadius || '0'; 
                } else {
                    maximizeBtn.title = "Maximize";
                    // Ganti ikon kembali menjadi kotak tunggal untuk "maximize"
                    maximizeIcon.innerHTML = iconMaximize;
                    // Kembalikan sudut default (8px)
                    appWindow.style.borderRadius = '8px'; 
                }
            }
            
            if (action === 'bring-to-front') {
                // Lakukan sesuatu jika jendela perlu diangkat ke depan (misalnya, menambahkan bayangan)
            }
        });

        // Pada saat inisialisasi, informasikan parent tentang ID aplikasi
        window.onload = () => {
            parent.postMessage({ action: 'register-frame', appId: appId, title: 'Aplikasi Kosong' }, '*');
        };
    </script>
</body>

</html>
