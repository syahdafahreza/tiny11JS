<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WinBox - Windows 11 Theme Example</title>
    <style>
      /* =========================================
           GLOBAL STYLES
           ========================================= */
      body {
        margin: 0;
        padding: 0;
        font-family:
          "Segoe UI",
          system-ui,
          -apple-system,
          sans-serif;
        background: url("https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&w=2564&auto=format&fit=crop")
          no-repeat center center fixed;
        background-size: cover;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        overflow: hidden; /* Mencegah scroll pada body */
      }

      .desktop-btn {
        padding: 12px 24px;
        font-size: 16px;
        font-weight: 600;
        background-color: rgba(255, 255, 255, 0.8);
        border: 1px solid rgba(255, 255, 255, 0.5);
        border-radius: 8px;
        backdrop-filter: blur(10px);
        cursor: pointer;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        transition: all 0.2s;
        margin-bottom: 48px; /* Ruang untuk taskbar */
      }
      .desktop-btn:hover {
        background-color: rgba(255, 255, 255, 1);
        box-shadow: 0 6px 12px rgba(0, 0, 0, 0.15);
      }

      /* =========================================
           WINBOX OVERRIDES (WINDOWS 11 STYLE)
           ========================================= */
      .winbox {
        border-radius: 8px; /* Rounded corners ala Win 11 */
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
        overflow: hidden;
        border: 1px solid rgba(128, 128, 128, 0.2);
        backdrop-filter: blur(20px); /* Efek Mica / Acrylic jika memungkinkan */
        /* Pastikan origin transform ada di tengah untuk animasi yang rapi */
        transform-origin: center center;
      }

      .winbox .wb-title {
        font-family: "Segoe UI", system-ui, sans-serif;
        font-size: 13px;
        font-weight: 400;
        text-align: center;
      }

      /* -----------------------------------------
         KUSTOMISASI ICON CONTROL (DARI MUSIC PLAYER)
         Menggunakan Inline SVG agar 100% Lokal
         ----------------------------------------- */
      .winbox .wb-control {
        display: flex;
      }
      
      .winbox .wb-control * {
        width: 45px !important;
        background-size: 10px auto !important;
        background-position: center !important;
        background-repeat: no-repeat !important;
        opacity: 1 !important; /* Matikan opacity bawaan WinBox */
        transition: background-color 0.15s;
      }

      /* Tombol Minimize Kustom kita */
      .wb-custom-min {
        background-image: url("data:image/svg+xml;charset=utf-8,%3Csvg width='10' height='2' viewBox='0 0 10 2' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M0 1H10V2H0V1Z' fill='%23ffffff' /%3E%3C/svg%3E") !important;
      }

      /* Icon Maximize */
      .winbox .wb-max {
        background-image: url("data:image/svg+xml;charset=utf-8,%3Csvg width='10' height='10' viewBox='0 0 10 10' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M9 1V9H1V1H9ZM10 0H0V10H10V0Z' fill='%23ffffff' /%3E%3C/svg%3E") !important;
      }
      
      /* Icon Close */
      .winbox .wb-close {
        background-image: url("data:image/svg+xml;charset=utf-8,%3Csvg width='10' height='10' viewBox='0 0 10 10' fill='none' xmlns='http://www.w3.org/2000/svg' stroke='%23ffffff' stroke-width='1.5' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M1 1L9 9M9 1L1 9'/%3E%3C/svg%3E") !important;
      }

      /* --- LIGHT THEME (DEFAULT) --- */
      .win11-light {
        background: #f3f3f3;
      }
      .win11-light .wb-title {
        color: #1a1a1a;
      }
      .win11-light .wb-body {
        background: #ffffff;
        color: #1a1a1a;
      }
      .win11-light .wb-control * {
        filter: invert(1);
      }
      .win11-light .wb-control *:hover {
        background-color: rgba(0, 0, 0, 0.05);
      }
      .win11-light .wb-close:hover {
        background-color: #e81123 !important;
        filter: invert(0) !important;
      }

      /* --- DARK THEME --- */
      .win11-dark {
        background: #202020;
        border: 1px solid #333333;
      }
      .win11-dark .wb-title {
        color: #ffffff;
      }
      .win11-dark .wb-body {
        background: #2b2b2b;
        color: #ffffff;
      }
      .win11-dark .wb-control * {
        filter: invert(0);
      }
      .win11-dark .wb-control *:hover {
        background-color: rgba(255, 255, 255, 0.1);
      }
      .win11-dark .wb-close:hover {
        background-color: #e81123 !important;
        filter: invert(0) !important;
      }

      /* =========================================
           CONTENT STYLES
           ========================================= */
      .content-wrapper {
        padding: 20px;
        display: flex;
        flex-direction: column;
        gap: 15px;
      }

      .theme-toggle-btn {
        padding: 8px 16px;
        border-radius: 4px;
        border: 1px solid #ccc;
        background: transparent;
        cursor: pointer;
        font-family: "Segoe UI", system-ui, sans-serif;
        font-weight: 600;
        transition: all 0.2s;
        width: max-content;
      }

      .win11-light .theme-toggle-btn {
        border-color: #d1d1d1;
        color: #1a1a1a;
        background: #f9f9f9;
      }
      .win11-light .theme-toggle-btn:hover {
        background: #e5e5e5;
      }

      .win11-dark .theme-toggle-btn {
        border-color: #555;
        color: #fff;
        background: #3a3a3a;
      }
      .win11-dark .theme-toggle-btn:hover {
        background: #4a4a4a;
      }

      /* =========================================
           TASKBAR WINDOWS 11 STYLES
           ========================================= */
      .win11-taskbar {
        position: fixed;
        bottom: 0;
        left: 0;
        width: 100%;
        height: 48px;
        background-color: rgba(243, 243, 243, 0.85); /* Light taskbar */
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        display: flex;
        justify-content: center;
        align-items: center;
        z-index: 99999; /* Pastikan selalu di atas */
        box-shadow: 0 -1px 5px rgba(0, 0, 0, 0.05);
      }

      .taskbar-icons {
        display: flex;
        gap: 6px;
        align-items: center;
      }

      .tb-icon {
        width: 40px;
        height: 40px;
        border-radius: 4px;
        display: flex;
        justify-content: center;
        align-items: center;
        cursor: pointer;
        position: relative;
        transition: background-color 0.2s ease;
      }

      .tb-icon:hover {
        background-color: rgba(255, 255, 255, 0.7);
      }

      .tb-icon:active {
        transform: scale(0.95);
      }

      /* Garis Indikator Window (Terbuka & Fokus) */
      .tb-icon.open::after {
        content: '';
        position: absolute;
        bottom: 2px;
        left: 50%;
        transform: translateX(-50%);
        width: 6px;
        height: 3px;
        background-color: #888;
        border-radius: 2px;
        transition: width 0.2s, background-color 0.2s;
      }

      /* Indikator window sedang aktif/fokus */
      .tb-icon.open.active::after {
        width: 16px;
        background-color: #0078d4;
      }
    </style>
  </head>
  <body>
    <!-- Tombol utama di Desktop -->
    <button id="btn-open-window" class="desktop-btn">
      Buka Pengaturan (WinBox)
    </button>

    <!-- Taskbar Windows 11 -->
    <div class="win11-taskbar">
      <div class="taskbar-icons" id="taskbar-apps">
        <!-- Start Button (Hanya Ikon, tanpa fungsi untuk simulasi UI) -->
        <div class="tb-icon start-btn" title="Start">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="22" height="22">
            <rect x="2" y="2" width="9" height="9" fill="#0078D4" rx="1"/>
            <rect x="13" y="2" width="9" height="9" fill="#0078D4" rx="1"/>
            <rect x="2" y="13" width="9" height="9" fill="#0078D4" rx="1"/>
            <rect x="13" y="13" width="9" height="9" fill="#0078D4" rx="1"/>
          </svg>
        </div>
        <!-- Ikon aplikasi (WinBox) akan ditambahkan di sini via JavaScript -->
      </div>
    </div>

    <!-- Template konten -->
    <div style="display: none">
      <div id="window-content-template" class="content-wrapper">
        <h2 style="margin: 0; font-weight: 500">Personalisasi</h2>
        <p style="margin: 0; font-size: 14px; line-height: 1.5">
          Pilih mode aplikasi default Anda. Mode ini hanya akan mempengaruhi
          window pengaturan ini secara mandiri (terisolasi).
        </p>
        <button class="theme-toggle-btn toggle-action">
          Beralih ke Dark Mode
        </button>
      </div>
    </div>

    <script>
      document.addEventListener("DOMContentLoaded", () => {
        const btnOpen = document.getElementById("btn-open-window");
        const template = document.getElementById("window-content-template");
        const taskbarAppsContainer = document.getElementById("taskbar-apps");

        // SVG Ikon "Pengaturan" (Inline SVG tanpa CDN)
        const settingsIconSVG = `
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="#4a4a4a" width="22" height="22">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />

          </svg>
        `;

        /**
         * FUNGSI HELPER: Menghitung jarak antara Window dan Ikon Taskbar
         */
        function calculateTransformDeltas(winbox, tbIcon) {
          // Dapatkan bounding rect dari window dan icon taskbar
          const winRect = winbox.g.getBoundingClientRect();
          const iconRect = tbIcon.getBoundingClientRect();

          // Cari titik tengah (center) dari masing-masing elemen
          const winCenterX = winRect.left + winRect.width / 2;
          const winCenterY = winRect.top + winRect.height / 2;

          const iconCenterX = iconRect.left + iconRect.width / 2;
          const iconCenterY = iconRect.top + iconRect.height / 2;

          // Kembalikan jarak X dan Y yang dibutuhkan untuk "pindah"
          return {
            x: iconCenterX - winCenterX,
            y: iconCenterY - winCenterY
          };
        }

        /**
         * ANIMASI KUSTOM: Menciutkan Jendela TERBANG ke Taskbar
         */
        function minimizeWindowToTaskbar(winbox) {
          const tbIcon = document.getElementById('tb-icon-' + winbox.id);
          if (!tbIcon) return winbox.hide(); // Fallback keamanan

          const deltas = calculateTransformDeltas(winbox, tbIcon);

          // Terapkan efek transisi yang lebih lambat dan natural (0.7 detik)
          // Durasi opacity DISAMAKAN agar window tidak hilang sebelum sampai taskbar
          winbox.g.style.transition = "transform 0.7s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.7s cubic-bezier(0.16, 1, 0.3, 1)";
          
          // Terbang ke lokasi Ikon Taskbar dan kecilkan
          winbox.g.style.transform = `translate(${deltas.x}px, ${deltas.y}px) scale(0.1)`;
          winbox.g.style.opacity = "0";
          winbox.g.style.pointerEvents = "none"; // Mencegah klik saat proses animasi
          
          // Setelah durasi transisi selesai (700ms)
          setTimeout(() => {
            winbox.hide();
            // Bersihkan gaya inline agar window kembali normal di "belakang layar"
            winbox.g.style.transition = ""; 
            winbox.g.style.transform = "";
            winbox.g.style.opacity = "";
            winbox.g.style.pointerEvents = "";
          }, 700);
          
          tbIcon.classList.remove('active');
        }

        /**
         * ANIMASI KUSTOM: Membuka Kembali Jendela MUNCUL dari Taskbar
         */
        function restoreWindowFromTaskbar(winbox) {
          const tbIcon = document.getElementById('tb-icon-' + winbox.id);

          // PENTING: Sembunyikan opacity dahulu sebelum di 'show'
          // Agar browser bisa merender elemen dan kita bisa menghitung ukurannya,
          // tapi user tidak melihat jendela melompat (flicker).
          winbox.g.style.transition = "none";
          winbox.g.style.opacity = "0";
          winbox.g.style.pointerEvents = "none";
          winbox.show(); 

          let startTransform = "scale(0.8) translateY(100px)"; // default fallback
          
          if (tbIcon) {
            // Hitung lokasi awal "terbang" (lokasi ikon saat ini)
            const deltas = calculateTransformDeltas(winbox, tbIcon);
            startTransform = `translate(${deltas.x}px, ${deltas.y}px) scale(0.1)`;
          }

          // Atur posisi window langsung berada di Ikon Taskbar
          winbox.g.style.transform = startTransform;

          winbox.g.style.transition = "transform 0.7s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.7s cubic-bezier(0.16, 1, 0.3, 1)";
          winbox.g.style.opacity = "1";
          winbox.g.style.transform = "translate(0px, 0px) scale(1)";

          // Bersihkan sisa gaya setelah animasi selesai
          setTimeout(() => {
            winbox.g.style.transition = "";
            winbox.g.style.transform = "";
            winbox.g.style.pointerEvents = "";
          }, 700);
          
          winbox.focus(); // Pastikan ada di depan

         * Fungsi untuk mendaftarkan WinBox ke dalam Taskbar kustom kita

          iconWrap.className = 'tb-icon open active'; // status awal terbuka & aktif

            if (originalFocus) originalFocus.apply(this);
          };

          const originalBlur = winbox.onblur;
          winbox.onblur = function() {
            iconWrap.classList.remove('active');
            if (originalBlur) originalBlur.apply(this);
          };

          const originalClose = winbox.onclose;
          winbox.onclose = function() {

          };

          // Masukkan ke dalam container Taskbar
          taskbarAppsContainer.appendChild(iconWrap);

        // Event saat tombol Buka Pengaturan diklik
        btnOpen.addEventListener("click", () => {
          const contentClone = template.cloneNode(true);
          contentClone.id = ""; // Hilangkan ID

          const win = new WinBox({
            title: "Pengaturan - Windows 11",
            width: "450px",
            height: "300px",
            x: "center",
            y: "center",
            bottom: 48, // Menghindari window menimpa taskbar jika di-maximize
            // Menggunakan "no-min" agar tombol minimize bawaan (yang melipat window di pojok kiri) hilang
            class: ["win11-light", "no-full", "no-min"], 
            mount: contentClone,
          });

          // Tambahkan tombol Minimize KUSTOM dengan Ikon baru kita
          win.addControl({
            index: 0,
            class: "wb-custom-min",
            click: function (event, winbox) {
              // Panggil animasi kustom kita
              minimizeWindowToTaskbar(winbox);
            }
          });

          // Daftarkan window ini ke Taskbar
          addAppToTaskbar(win, settingsIconSVG);

          // Logika Toggle Tema window
          const toggleBtn = contentClone.querySelector(".toggle-action");
          let isDarkMode = false;

          toggleBtn.addEventListener("click", () => {
            isDarkMode = !isDarkMode;

            if (isDarkMode) {
              win.removeClass("win11-light");
              win.addClass("win11-dark");
              toggleBtn.innerText = "Beralih ke Light Mode";
            } else {
              win.removeClass("win11-dark");
              win.addClass("win11-light");
              toggleBtn.innerText = "Beralih ke Dark Mode";
            }
          });
        });
      });
